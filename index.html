<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maveli's Endless Pookkalam Dash 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #ui-header {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    h1 { color: #f59e0b; font-size: 1.3rem; text-shadow: 2px 2px #000; }
    .status-bar {
      color: #fde047;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 6px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    .controls {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 15px;
    }
    .btn {
      width: 65px;
      height: 65px;
      background: rgba(217, 119, 6, 0.85);
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      border: 2px solid #fff;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .btn:active { background: #b45309; transform: scale(0.92); }
    #btn-jump { background: rgba(16, 185, 129, 0.85); font-size: 0.95rem; width: 75px; border-radius: 18px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-header">
    <h1>🏃 Maveli's Endless Dash 🏃</h1>
    <div class="status-bar">
      <span id="score-text">Distance: 0m</span>
      <span id="flower-text">🌺 0</span>
    </div>
  </div>

  <div id="canvas-container"></div>

  <div class="controls">
    <button class="btn" id="btn-left">◄</button>
    <button class="btn" id="btn-jump">JUMP</button>
    <button class="btn" id="btn-right">►</button>
  </div>

<script>
  // Audio Synthesizer
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, duration, type = "sine") {
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // Three.js Core Setup
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0284c7);
  scene.fog = new THREE.FogExp2(0x0284c7, 0.012);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 5, 9);
  camera.lookAt(0, 2, -10);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
  scene.add(ambientLight);
  const dirLight = new THREE.DirectionalLight(0xfef08a, 0.9);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // Track & Environment Lanes (-3.5, 0, 3.5)
  const LANES = [-3.5, 0, 3.5];
  let currentLane = 1;

  const trackFloor = new THREE.Mesh(
    new THREE.PlaneGeometry(16, 300),
    new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.8 })
  );
  trackFloor.rotation.x = -Math.PI / 2;
  trackFloor.position.z = -100;
  trackFloor.receiveShadow = true;
  scene.add(trackFloor);

  // Decorative Side Trees
  const trees = [];
  for (let z = 20; z > -250; z -= 12) {
    [-10, 10].forEach(x => {
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2.5), new THREE.MeshStandardMaterial({ color: 0x78350f }));
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.6, 3.5, 8), new THREE.MeshStandardMaterial({ color: 0x166534 }));
      trunk.position.set(x, 1.25, z);
      leaves.position.set(x, 3.5, z);
      scene.add(trunk, leaves);
      trees.push(trunk, leaves);
    });
  }

  // Player (King Maveli)
  const playerGroup = new THREE.Group();
  const bodyMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
  bodyMesh.position.y = 0.8;
  bodyMesh.castShadow = true;
  playerGroup.add(bodyMesh);

  const crownMesh = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.7, 8), new THREE.MeshStandardMaterial({ color: 0xfde047, metalness: 0.8 }));
  crownMesh.position.y = 1.7;
  playerGroup.add(crownMesh);
  
  playerGroup.position.set(LANES[currentLane], 0, 0);
  scene.add(playerGroup);

  // Jump Variables
  let playerY = 0;
  let velY = 0;
  const gravity = -0.016;
  let isGrounded = true;

  // Game Engine State
  let gameSpeed = 0.45;
  let distance = 0;
  let flowersCollected = 0;
  let gameOver = false;

  const spawnedObjects = []; // Holds active obstacles and flowers

  // Controls
  function moveLeft() {
    if (gameOver) return;
    if (currentLane > 0) { currentLane--; playSound(400, 0.05); }
  }
  function moveRight() {
    if (gameOver) return;
    if (currentLane < 2) { currentLane++; playSound(400, 0.05); }
  }
  function jump() {
    if (gameOver) return;
    if (isGrounded) {
      velY = 0.38;
      isGrounded = false;
      playSound(600, 0.15);
    }
  }

  window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "a") moveLeft();
    if (e.key === "ArrowRight" || e.key === "d") moveRight();
    if (e.key === "ArrowUp" || e.key === "w" || e.key === " ") jump();
  });

  document.getElementById("btn-left").addEventListener("click", moveLeft);
  document.getElementById("btn-right").addEventListener("click", moveRight);
  document.getElementById("btn-jump").addEventListener("click", jump);

  // Spawner Logic
  let nextSpawnDistance = 0;

  function spawnRow() {
    const laneIndex = Math.floor(Math.random() * 3);
    const type = Math.random();

    // Spawn Asura Guard (Tall Obstacle)
    if (type < 0.35) {
      const guard = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 2.2, 16), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
      guard.position.set(LANES[laneIndex], 1.1, -120);
      guard.castShadow = true;
      scene.add(guard);
      spawnedObjects.push({ mesh: guard, type: "guard", lane: laneIndex });
    }
    // Spawn Hurdle (Jumpable Low Obstacle)
    else if (type < 0.65) {
      const hurdle = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.7, 0.4), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
      hurdle.position.set(LANES[laneIndex], 0.35, -120);
      hurdle.castShadow = true;
      scene.add(hurdle);
      spawnedObjects.push({ mesh: hurdle, type: "hurdle", lane: laneIndex });
    }
    // Spawn Flower Row (Collectible)
    else {
      for (let i = 0; i < 3; i++) {
        const flower = new THREE.Mesh(new THREE.DodecahedronGeometry(0.45), new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xf59e0b, emissiveIntensity: 0.5 }));
        flower.position.set(LANES[laneIndex], 0.6, -120 - (i * 4));
        scene.add(flower);
        spawnedObjects.push({ mesh: flower, type: "flower", lane: laneIndex });
      }
    }
  }

  function resetGame() {
    spawnedObjects.forEach(obj => scene.remove(obj.mesh));
    spawnedObjects.length = 0;
    currentLane = 1;
    playerGroup.position.set(LANES[1], 0, 0);
    playerY = 0;
    velY = 0;
    isGrounded = true;
    gameSpeed = 0.45;
    distance = 0;
    flowersCollected = 0;
    gameOver = false;
    document.getElementById("score-text").innerText = "Distance: 0m";
    document.getElementById("flower-text").innerText = "🌺 0";
  }

  // Main Loop
  function update() {
    if (gameOver) return;

    // Smooth lane translation
    playerGroup.position.x += (LANES[currentLane] - playerGroup.position.x) * 0.25;

    // Gravity & Jump Physics
    playerY += velY;
    velY += gravity;
    if (playerY <= 0) {
      playerY = 0;
      velY = 0;
      isGrounded = true;
    }
    playerGroup.position.y = playerY;

    // Speed scaling & distance counter
    gameSpeed += 0.00005;
    distance += gameSpeed * 0.5;
    document.getElementById("score-text").innerText = `Distance: ${Math.floor(distance)}m`;

    // Dynamic Spawning
    if (distance > nextSpawnDistance) {
      spawnRow();
      nextSpawnDistance = distance + (12 + Math.random() * 8);
    }

    // Move Environment Trees endlessly
    trees.forEach(tree => {
      tree.position.z += gameSpeed;
      if (tree.position.z > 20) tree.position.z -= 270;
    });

    // Move & Handle Active Objects
    for (let i = spawnedObjects.length - 1; i >= 0; i--) {
      const item = spawnedObjects[i];
      item.mesh.position.z += gameSpeed;

      if (item.type === "flower") item.mesh.rotation.y += 0.05;

      // Check Collisions near Z = 0
      if (Math.abs(item.mesh.position.z - playerGroup.position.z) < 1.0) {
        if (item.lane === currentLane) {
          
          // Flower Pick
          if (item.type === "flower") {
            scene.remove(item.mesh);
            spawnedObjects.splice(i, 1);
            flowersCollected++;
            playSound(800, 0.1);
            document.getElementById("flower-text").innerText = `🌺 ${flowersCollected}`;
            continue;
          }

          // Hurdle Collision (Dodge by Jumping)
          if (item.type === "hurdle" && playerY < 0.7) {
            triggerGameOver();
          }

          // Guard Collision (Cannot jump over)
          if (item.type === "guard") {
            triggerGameOver();
          }
        }
      }

      // Despawn old objects
      if (item.mesh.position.z > 15) {
        scene.remove(item.mesh);
        spawnedObjects.splice(i, 1);
      }
    }
  }

  function triggerGameOver() {
    gameOver = true;
    playSound(150, 0.5, "sawtooth");
    document.getElementById("score-text").innerText = `GAME OVER! Final Score: ${Math.floor(distance)}m`;
  }

  window.addEventListener("click", () => {
    if (gameOver) resetGame();
  });

  function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
