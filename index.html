<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pathala to Pookkalam 3D - Maveli's Stealth Visit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #111827;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #ui-header {
      position: absolute;
      top: 15px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      width: 100%;
    }
    h1 { color: #f4a261; font-size: 1.4rem; text-shadow: 2px 2px #000; }
    .status-bar { color: #e9c46a; font-weight: bold; font-size: 0.95rem; margin-top: 4px; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    .controls {
      position: absolute;
      bottom: 25px;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-gap: 10px;
    }
    .btn {
      width: 60px;
      height: 60px;
      background: rgba(231, 111, 81, 0.85);
      color: white;
      font-weight: bold;
      font-size: 1.4rem;
      border: 2px solid #fff;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .btn:active { background: #e76f51; transform: scale(0.95); }
    #btn-up { grid-column: 2; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-header">
    <h1>🌺 Pathala to Pookkalam 3D 🌺</h1>
    <div class="status-bar">
      <span id="score-text">Flowers: 0 / 3</span> | 
      <span id="status-text">Status: Sneaking...</span>
    </div>
  </div>

  <div id="canvas-container"></div>

  <div class="controls">
    <button class="btn" id="btn-up">▲</button>
    <button class="btn" id="btn-left">◄</button>
    <button class="btn" id="btn-down">▼</button>
    <button class="btn" id="btn-right">►</button>
  </div>

<script>
  // Audio Synth Context
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, duration, type = "sine") {
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  // Three.js Core Setup
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111827);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 24, 20);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffb703, 0.8);
  dirLight.position.set(10, 20, 10);
  dirLight.castShadow = true;
  scene.add(dirLight);

  // Courtyard Floor
  const floorGeo = new THREE.PlaneGeometry(30, 30);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x2a9d8f, roughness: 0.8 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // 3D Player (Maveli with Golden Crown)
  const playerGroup = new THREE.Group();
  
  const bodyGeo = new THREE.SphereGeometry(0.8, 16, 16);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf4a261 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.8;
  body.castShadow = true;
  playerGroup.add(body);

  const crownGeo = new THREE.ConeGeometry(0.5, 0.7, 8);
  const crownMat = new THREE.MeshStandardMaterial({ color: 0xe9c46a, metalness: 0.6 });
  const crown = new THREE.Mesh(crownGeo, crownMat);
  crown.position.y = 1.8;
  crown.castShadow = true;
  playerGroup.add(crown);

  playerGroup.position.set(-12, 0, -12);
  scene.add(playerGroup);

  // 3D Goal (Layered Pookkalam)
  const goalGroup = new THREE.Group();
  const pook1 = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.1, 32), new THREE.MeshStandardMaterial({ color: 0xe9c46a }));
  const pook2 = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.12, 32), new THREE.MeshStandardMaterial({ color: 0xe76f51 }));
  const pook3 = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.14, 32), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  goalGroup.add(pook1, pook2, pook3);
  goalGroup.position.set(12, 0.05, 12);
  scene.add(goalGroup);

  // 3D Flowers (Collectibles)
  const flowerPositions = [
    { x: -5, z: -8 },
    { x: -10, z: 8 },
    { x: 8, z: -5 }
  ];
  const flowers = [];
  flowerPositions.forEach(pos => {
    const fGeo = new THREE.DodecahedronGeometry(0.45);
    const fMat = new THREE.MeshStandardMaterial({ color: 0xffb703, emissive: 0xf4a261, emissiveIntensity: 0.3 });
    const mesh = new THREE.Mesh(fGeo, fMat);
    mesh.position.set(pos.x, 0.5, pos.z);
    mesh.castShadow = true;
    scene.add(mesh);
    flowers.push({ mesh, collected: false, x: pos.x, z: pos.z });
  });

  // 3D Hiding Bushes (Banana Leaves)
  const bushPositions = [
    { x: -2, z: 0, w: 4, d: 4 },
    { x: 6, z: -8, w: 4, d: 4 }
  ];
  const bushes = [];
  bushPositions.forEach(b => {
    const bGeo = new THREE.BoxGeometry(b.w, 1.2, b.d);
    const bMat = new THREE.MeshStandardMaterial({ color: 0x1b4332, transparent: true, opacity: 0.85 });
    const mesh = new THREE.Mesh(bGeo, bMat);
    mesh.position.set(b.x, 0.6, b.z);
    scene.add(mesh);
    bushes.push({ mesh, x: b.x, z: b.z, w: b.w, d: b.d });
  });

  // 3D Pathala Guards (Red Cylinders)
  const guardData = [
    { mesh: null, x: -8, z: -4, vx: 0.1, vz: 0, minX: -11, maxX: 0, minZ: -4, maxZ: -4 },
    { mesh: null, x: 4, z: 2, vx: 0, vz: 0.12, minX: 4, maxX: 4, minZ: -4, maxZ: 10 },
    { mesh: null, x: 0, z: 10, vx: 0.14, vz: 0, minX: -8, maxX: 8, minZ: 10, maxZ: 10 }
  ];

  guardData.forEach(g => {
    const gGeo = new THREE.CylinderGeometry(0.7, 0.7, 1.8, 16);
    const gMat = new THREE.MeshStandardMaterial({ color: 0xd62828 });
    const mesh = new THREE.Mesh(gGeo, gMat);
    mesh.position.set(g.x, 0.9, g.z);
    mesh.castShadow = true;
    scene.add(mesh);
    g.mesh = mesh;
  });

  // Controls & Game Logic
  let flowersCollected = 0;
  let gameOver = false;
  let gameWon = false;
  const speed = 0.18;
  const keys = {};

  window.addEventListener("keydown", e => keys[e.key] = true);
  window.addEventListener("keyup", e => keys[e.key] = false);

  function setupTouch(id, keyName) {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[keyName] = true; });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyName] = false; });
    btn.addEventListener("mousedown", () => keys[keyName] = true);
    btn.addEventListener("mouseup", () => keys[keyName] = false);
  }
  setupTouch("btn-up", "ArrowUp");
  setupTouch("btn-left", "ArrowLeft");
  setupTouch("btn-down", "ArrowDown");
  setupTouch("btn-right", "ArrowRight");

  function resetGame() {
    playerGroup.position.set(-12, 0, -12);
    flowersCollected = 0;
    flowers.forEach(f => {
      f.collected = false;
      f.mesh.visible = true;
    });
    gameOver = false;
    gameWon = false;
    document.getElementById("status-text").innerText = "Status: Sneaking...";
    document.getElementById("score-text").innerText = "Flowers: 0 / 3";
  }

  function update() {
    if (gameOver || gameWon) return;

    let dx = 0, dz = 0;
    if (keys["ArrowUp"] || keys["w"] || keys["W"]) dz -= speed;
    if (keys["ArrowDown"] || keys["s"] || keys["S"]) dz += speed;
    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx -= speed;
    if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx += speed;

    playerGroup.position.x = Math.max(-13.5, Math.min(13.5, playerGroup.position.x + dx));
    playerGroup.position.z = Math.max(-13.5, Math.min(13.5, playerGroup.position.z + dz));

    // Check Hiding
    let isHidden = false;
    bushes.forEach(b => {
      if (Math.abs(playerGroup.position.x - b.x) < b.w / 2 && Math.abs(playerGroup.position.z - b.z) < b.d / 2) {
        isHidden = true;
      }
    });

    if (isHidden) {
      document.getElementById("status-text").innerText = "Status: Hidden in Banana Leaves! 🌿";
    } else {
      document.getElementById("status-text").innerText = "Status: Sneaking...";
    }

    // Move Guards & Collision Detection
    guardData.forEach(g => {
      g.x += g.vx;
      g.z += g.vz;
      if (g.x < g.minX || g.x > g.maxX) g.vx *= -1;
      if (g.z < g.minZ || g.z > g.maxZ) g.vz *= -1;
      g.mesh.position.set(g.x, 0.9, g.z);

      const dist = Math.hypot(playerGroup.position.x - g.x, playerGroup.position.z - g.z);
      if (!isHidden && dist < 1.3) {
        gameOver = true;
        playSound(150, 0.4, "sawtooth");
        document.getElementById("status-text").innerText = "Caught by Guard! Tap screen to restart.";
      }
    });

    // Collect 3D Flowers
    flowers.forEach(f => {
      if (!f.collected) {
        f.mesh.rotation.y += 0.03;
        const dist = Math.hypot(playerGroup.position.x - f.x, playerGroup.position.z - f.z);
        if (dist < 1.2) {
          f.collected = true;
          f.mesh.visible = false;
          flowersCollected++;
          playSound(587.33, 0.15, "sine");
          document.getElementById("score-text").innerText = `Flowers: ${flowersCollected} / 3`;
        }
      }
    });

    // Reach 3D Pookkalam
    const goalDist = Math.hypot(playerGroup.position.x - 12, playerGroup.position.z - 12);
    if (goalDist < 1.8) {
      if (flowersCollected === flowers.length) {
        gameWon = true;
        playSound(880, 0.5, "sine");
        document.getElementById("status-text").innerText = "HAPPY ONAM! Maveli Reached Earth! 🎉";
      } else {
        document.getElementById("status-text").innerText = "Collect all flowers for Pookkalam first!";
      }
    }
  }

  window.addEventListener("click", () => {
    if (gameOver || gameWon) resetGame();
  });

  function animate() {
    requestAnimationFrame(animate);
    update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
