<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pathala to Pookkalam - Maveli's Stealth Visit</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #1b263b;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    h1 { color: #f4a261; margin-bottom: 5px; text-shadow: 2px 2px #000; text-align: center; }
    p { font-size: 0.95rem; color: #e0e1dd; margin-bottom: 10px; text-align: center; }
    #game-container {
      position: relative;
      border: 4px solid #f4a261;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.6);
      background-color: #2a9d8f;
    }
    canvas { display: block; background: #2a9d8f; }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-gap: 8px;
      margin-top: 15px;
    }
    .btn {
      width: 60px;
      height: 60px;
      background: #e76f51;
      color: white;
      font-weight: bold;
      font-size: 1.4rem;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px #b84328;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px #b84328; }
    #btn-up { grid-column: 2; }
    #btn-left { grid-column: 1; }
    #btn-down { grid-column: 2; }
    #btn-right { grid-column: 3; }
    .status-bar {
      margin-top: 8px;
      font-weight: bold;
      color: #e9c46a;
      display: flex;
      gap: 20px;
    }
  </style>
</head>
<body>

  <h1>🌺 Pathala to Pookkalam 🌺</h1>
  <p>Guide King Maveli to the Pookkalam! Dodge Pathala Guards and collect flowers.</p>
  
  <div class="status-bar">
    <span id="score-text">Flowers: 0 / 3</span>
    <span id="status-text">Status: Sneaking...</span>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="480" height="480"></canvas>
  </div>

  <div class="controls">
    <button class="btn" id="btn-up">▲</button>
    <button class="btn" id="btn-left">◄</button>
    <button class="btn" id="btn-down">▼</button>
    <button class="btn" id="btn-right">►</button>
  </div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  function playSound(freq, duration, type = "sine") {
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  let flowersCollected = 0;
  let gameOver = false;
  let gameWon = false;

  const player = { x: 40, y: 40, size: 28, speed: 4 };
  const goal = { x: 400, y: 400, size: 36 };

  const flowers = [
    { x: 200, y: 80, collected: false },
    { x: 80, y: 360, collected: false },
    { x: 360, y: 200, collected: false }
  ];

  const guards = [
    { x: 120, y: 120, vx: 3, vy: 0, rangeMin: 80, rangeMax: 380, axis: 'x' },
    { x: 280, y: 240, vx: 0, vy: 3.5, rangeMin: 80, rangeMax: 400, axis: 'y' },
    { x: 200, y: 360, vx: 4, vy: 0, rangeMin: 120, rangeMax: 400, axis: 'x' }
  ];

  const bushes = [
    { x: 160, y: 200, w: 60, h: 60 },
    { x: 280, y: 80, w: 60, h: 60 }
  ];

  const keys = {};
  window.addEventListener("keydown", e => keys[e.key] = true);
  window.addEventListener("keyup", e => keys[e.key] = false);

  function setupTouch(id, keyName) {
    const btn = document.getElementById(id);
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); keys[keyName] = true; });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyName] = false; });
    btn.addEventListener("mousedown", () => keys[keyName] = true);
    btn.addEventListener("mouseup", () => keys[keyName] = false);
  }
  setupTouch("btn-up", "ArrowUp");
  setupTouch("btn-left", "ArrowLeft");
  setupTouch("btn-down", "ArrowDown");
  setupTouch("btn-right", "ArrowRight");

  function isColliding(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y) < (a.size / 2 + (b.size || 20) / 2);
  }

  function resetGame() {
    player.x = 40;
    player.y = 40;
    flowersCollected = 0;
    flowers.forEach(f => f.collected = false);
    gameOver = false;
    gameWon = false;
    document.getElementById("status-text").innerText = "Status: Sneaking...";
    document.getElementById("score-text").innerText = "Flowers: 0 / 3";
  }

  function update() {
    if (gameOver || gameWon) return;

    let dx = 0, dy = 0;
    if (keys["ArrowUp"] || keys["w"] || keys["W"]) dy -= player.speed;
    if (keys["ArrowDown"] || keys["s"] || keys["S"]) dy += player.speed;
    if (keys["ArrowLeft"] || keys["a"] || keys["A"]) dx -= player.speed;
    if (keys["ArrowRight"] || keys["d"] || keys["D"]) dx += player.speed;

    player.x = Math.max(20, Math.min(canvas.width - 20, player.x + dx));
    player.y = Math.max(20, Math.min(canvas.height - 20, player.y + dy));

    let isHidden = false;
    bushes.forEach(b => {
      if (player.x > b.x && player.x < b.x + b.w && player.y > b.y && player.y < b.y + b.h) {
        isHidden = true;
      }
    });

    if (isHidden) {
      document.getElementById("status-text").innerText = "Status: Hidden in Banana Leaves! 🌿";
    } else {
      document.getElementById("status-text").innerText = "Status: Sneaking...";
    }

    guards.forEach(g => {
      if (g.axis === 'x') {
        g.x += g.vx;
        if (g.x < g.rangeMin || g.x > g.rangeMax) g.vx *= -1;
      } else {
        g.y += g.vy;
        if (g.y < g.rangeMin || g.y > g.rangeMax) g.vy *= -1;
      }

      if (!isHidden && isColliding(player, { x: g.x, y: g.y, size: 24 })) {
        gameOver = true;
        playSound(150, 0.4, "sawtooth");
        document.getElementById("status-text").innerText = "Caught by Pathala Guard! Press R to Restart.";
      }
    });

    flowers.forEach(f => {
      if (!f.collected && isColliding(player, { x: f.x, y: f.y, size: 20 })) {
        f.collected = true;
        flowersCollected++;
        playSound(587.33, 0.15, "sine");
        document.getElementById("score-text").innerText = `Flowers: ${flowersCollected} / 3`;
      }
    });

    if (isColliding(player, goal)) {
      if (flowersCollected === flowers.length) {
        gameWon = true;
        playSound(880, 0.5, "sine");
        document.getElementById("status-text").innerText = "HAPPY ONAM! Maveli Reached Earth! 🎉";
      } else {
        document.getElementById("status-text").innerText = "Collect all flowers for Pookkalam first!";
      }
    }
  }

  function draw() {
    ctx.fillStyle = "#2a9d8f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    for (let i = 0; i < canvas.width; i += 40) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
    }

    bushes.forEach(b => {
      ctx.fillStyle = "#1b4332";
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 10);
      ctx.fill();
      ctx.fillStyle = "#52b788";
      ctx.font = "14px Arial";
      ctx.fillText("🌿 Hide", b.x + 8, b.y + 35);
    });

    ctx.fillStyle = "#e9c46a";
    ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.size / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e76f51";
    ctx.beginPath(); ctx.arc(goal.x, goal.y, goal.size / 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = "12px Arial";
    ctx.fillText("🌺 Goal", goal.x - 18, goal.y + 25);

    flowers.forEach(f => {
      if (!f.collected) {
        ctx.fillStyle = "#f4a261";
        ctx.beginPath(); ctx.arc(f.x, f.y, 10, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#e76f51";
        ctx.beginPath(); ctx.arc(f.x, f.y, 4, 0, Math.PI * 2); ctx.fill();
      }
    });

    guards.forEach(g => {
      ctx.fillStyle = "#d62828";
      ctx.beginPath(); ctx.arc(g.x, g.y, 14, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(214, 40, 40, 0.25)";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(g.x, g.y, 35, 0, Math.PI * 2); ctx.stroke();
    });

    ctx.fillStyle = "#f4a261";
    ctx.beginPath(); ctx.arc(player.x, player.y, player.size / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#e9c46a";
    ctx.fillRect(player.x - 8, player.y - 18, 16, 6);
    ctx.fillStyle = "#ffffff";
    ctx.font = "14px Arial";
    ctx.fillText("👑", player.x - 7, player.y - 12);

    if (gameOver) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#e76f51";
      ctx.font = "bold 26px Arial";
      ctx.textAlign = "center";
      ctx.fillText("CAUGHT BY PATHALA GUARD!", canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = "#ffffff";
      ctx.font = "16px Arial";
      ctx.fillText("Press 'R' or Tap Screen to Try Again", canvas.width / 2, canvas.height / 2 + 30);
      ctx.textAlign = "left";
    } else if (gameWon) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#e9c46a";
      ctx.font = "bold 28px Arial";
      ctx.textAlign = "center";
      ctx.fillText("🎉 HAPPY ONAM! 🎉", canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = "#ffffff";
      ctx.font = "16px Arial";
      ctx.fillText("Maveli successfully blessed Earth!", canvas.width / 2, canvas.height / 2 + 20);
      ctx.textAlign = "left";
    }
  }

  window.addEventListener("keydown", (e) => {
    if (e.key === 'r' || e.key === 'R') resetGame();
  });
  canvas.addEventListener("click", () => {
    if (gameOver || gameWon) resetGame();
  });

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
